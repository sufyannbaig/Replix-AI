# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Replix-ai-new"
handle = "replix-ai-new"
application_url = "https://replixai.co.uk"
embedded = false
client_id = "3ad574a2b1c2a9835228a4b2e2c7a78e"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = true

[auth]
redirect_urls = [ "https://replixai.co.uk/api/public/shopify/callback" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/api/public/shopify/webhooks/app-uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/api/public/shopify/webhooks/customers-data-request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/api/public/shopify/webhooks/customers-redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/api/public/shopify/webhooks/shop-redact"
  compliance_topics = [ "shop/redact" ]

[pos]
embedded = false
